name: Deploy SIBANTU ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unggah berkas situs (folder web/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
